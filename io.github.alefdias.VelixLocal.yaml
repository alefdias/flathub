app-id: io.github.alefdias.VelixLocal
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: velix-local

only-arches:
  - x86_64

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: velix-local
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib/velix-local /app/share/applications /app/share/metainfo /app/share/icons/hicolor/192x192/apps
      - cp -r * /app/lib/velix-local/
      - ln -sf /app/lib/velix-local/velix-local /app/bin/velix-local
      - install -Dm644 io.github.alefdias.VelixLocal.desktop /app/share/applications/io.github.alefdias.VelixLocal.desktop
      - install -Dm644 io.github.alefdias.VelixLocal.metainfo.xml /app/share/metainfo/io.github.alefdias.VelixLocal.metainfo.xml
      - install -Dm644 io.github.alefdias.VelixLocal.png /app/share/icons/hicolor/192x192/apps/io.github.alefdias.VelixLocal.png
    sources:
      - type: archive
        url: https://github.com/alefdias/Velix-Local/releases/download/v1.0.16/velix-local-linux-x64.tar.gz
        sha256: 47edbe8038623af49045ea67cede42ea89065b241c4b0574aaa84a7fcc592394
      - type: file
        path: io.github.alefdias.VelixLocal.desktop
      - type: file
        path: io.github.alefdias.VelixLocal.metainfo.xml
      - type: file
        path: io.github.alefdias.VelixLocal.png
